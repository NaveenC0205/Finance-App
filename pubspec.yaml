name: family_finance_tracker
description: Track family finances across multiple bank accounts
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (auth + database + storage)
  supabase_flutter: ^2.8.4

  # Google Sign-In (native mobile)
  google_sign_in: ^6.2.2

  # State management
  provider: ^6.1.2
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # File picker (PDF, CSV, Excel)
  file_picker: ^8.1.7

  # File parsing
  csv: ^6.0.0
  excel: ^4.0.6

  # Image picker (profile photo)
  image_picker: ^1.1.2

  # HTTP
  http: ^1.2.2

  # Storage / path
  path_provider: ^2.1.5
  path: ^1.9.1

  # Formatting
  intl: ^0.19.0

  # Share (invite links)
  share_plus: ^10.1.4

  # Toast notifications
  fluttertoast: ^8.2.12

  # Shimmer loading
  shimmer: ^3.0.0

  # URL launcher
  url_launcher: ^6.3.1

  # Cached network image
  cached_network_image: ^3.4.1

  # Local storage
  shared_preferences: ^2.3.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
